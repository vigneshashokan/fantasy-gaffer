# Flow 2 — fresh account connects an FPL team and sees the populated squad.
appId: com.fantasygaffer.app
---
- runFlow:
    file: subflows/signin.yaml
    env:
      EMAIL: ${EMAIL_B}
      PASSWORD: ${PASSWORD}
- extendedWaitUntil:
    visible:
      id: "connect-team-cta"
    timeout: 90000
- tapOn:
    id: "connect-team-cta"
- tapOn:
    id: "team-id-input"
- inputText: ${ENTRY_ID}
# No hideKeyboard here: the team-id field uses a NUMERIC keypad (no return key),
# and Maestro's iOS hideKeyboard can't reliably dismiss that (it fails outright).
# The "Continue" submit button renders above the keypad and is tappable directly,
# and the keypad dismisses on its own once the screen advances to the confirm view.
- tapOn:
    id: "connect-team-submit"
- extendedWaitUntil:
    visible:
      id: "connect-team-confirm"
    timeout: 60000
- tapOn:
    id: "connect-team-confirm"
- extendedWaitUntil:
    visible:
      id: "gw-carousel"
    timeout: 90000
# Pitch cards group badge + name ("1, Elanga"); Maestro text is a full-string
# regex, so match the name within the grouped label.
- assertVisible: ".*${PLAYER_NAME}.*"
